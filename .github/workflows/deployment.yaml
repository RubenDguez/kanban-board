name: DEPLOYMENT

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }} 
      
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: setup RSA private key
        id: setup-rsa-private-key
        run: |
          ssh -T ubuntu@ec2-3-95-200-25.compute-1.amazonaws.com
          echo "${SSH_PRIVATE_KEY}" >> id_rsa
          chmod 0600 id_rsa
          ssh -i id_rsa ubuntu@ec2-3-95-200-25.compute-1.amazonaws.com ./deploy.sh 
